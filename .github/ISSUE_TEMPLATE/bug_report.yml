name: Bug report
description: Report a reproducible problem using synthetic data.
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: Expected and actual behaviour
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal synthetic reproduction
      description: Include commands and the affected commit; exclude secrets, private sources and real conversations.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and enabled capabilities
      description: OS, Python/Rust versions, native or reference backend, SQLCipher and local model availability.
    validations:
      required: true
