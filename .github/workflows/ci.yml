name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install reference test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Build native release
        run: cargo build --manifest-path rust-broker/Cargo.toml --locked --release
      - name: Python and native integration tests
        run: python -B -m unittest discover -s scripts -p "test*.py"
      - name: Rust tests
        run: cargo test --manifest-path rust-broker/Cargo.toml --locked --all-targets
      - name: Rust lint
        run: cargo clippy --manifest-path rust-broker/Cargo.toml --locked --all-targets -- -D warnings
