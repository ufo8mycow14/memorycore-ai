[package]
name = "memorycore-ai-broker"
version = "0.5.0-dev"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/ufo8mycow14/memorycore-ai-for-codex"
description = "Local persistent memory and compact evidence retrieval for OpenAI Codex via MCP"

[features]
sqlcipher = ["rusqlite/bundled-sqlcipher-vendored-openssl"]
# Compatibility alias; TurboVec is mandatory even with --no-default-features.
vector-search = []
async-sqlite = ["dep:tokio-rusqlite"]

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.150", features = ["float_roundtrip"] }
tokio = { version = "=1.52.3", features = ["rt-multi-thread", "macros", "process", "io-util", "io-std", "sync", "time"] }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled", "cache", "backup"] }
flate2 = "=1.1.9"
blake2b_simd = "=1.0.5"
sha2 = "=0.10.9"
hex = "=0.4.3"
chrono = "=0.4.45"
uuid = { version = "=1.23.5", features = ["v4"] }
regex = "=1.13.0"
tiktoken-rs = "=0.12.0"
base64 = "=0.22.1"
zeroize = "=1.8.2"
unicode-casefold = "=0.2.0"
cap-std = "=4.0.3"
turbovec = "=1.0.0"
tokio-rusqlite = { version = "=0.8.0", optional = true }

[patch.crates-io]
turbovec = { path = "vendor/turbovec" }

[[example]]
name = "async_sqlite_check"
required-features = ["async-sqlite"]

[[example]]
name = "vector_check"
